# yaml-language-server: $schema=https://astropods.ai/schema/package.json
spec: blueprint/v1
name: slack-radar

agent:
  build:
    context: .
    dockerfile: agent/Dockerfile
  interfaces:
    frontend: false
    messaging: true
  # Drives BOTH liveness and readiness, so it must not gate on Slack or
  # Postgres — 503 on a dependency blip would restart the pod every check.
  healthcheck:
    path: /health
    interval: 10s
    timeout: 5s
    retries: 5

# Local dev only. Deployed, channels come from the deploy page's "Observe
# Channel IDs" and crons are set at deploy time.
dev:
  interfaces:
    messaging:
      adapters: [slack]
      slack:
        # Replace with your own. Leave "Allowed Channel IDs" blank everywhere:
        # a non-empty allowlist makes the sidecar post a refusal into every
        # channel it rejects.
        observe_channel_ids:
          - C0BU9P6R5U5
  schedules:
    # The real latency floor — nothing is judged sooner than the next tick.
    discussion_sweep: "* * * * *"
    lead_digest: "0 9,14 * * 1-5"

# Gateway entry only, and only to get ASTRO_GATEWAY_URL / ASTRO_GATEWAY_API_KEY
# injected for the jev-1-13-0 decision model. The agent and judge credentials
# are top-level inputs instead: a provider entry reaches the agent container
# only, which would make the sweep carry a second copy of the same secret.
# MODEL_DEFAULT is injected and unread — decisions take the model id in the body.
models:
  default:
    provider: gateway
    models: [claude-haiku-4-5]

knowledge:
  slackradardb:
    provider: postgres

inputs:
  # Set BASETEN_API_KEY and the whole agent (chat + judge) runs on Baseten;
  # leave it blank and everything runs on Anthropic. No mixed mode.
  ANTHROPIC_API_KEY:
    name: ANTHROPIC_API_KEY
    datatype: string
    secret: true
    optional: true
    description: "Used by both the agent and the sweep judge. Required unless BASETEN_API_KEY is set."
  ANTHROPIC_MODEL:
    name: ANTHROPIC_MODEL
    datatype: string
    default: "claude-haiku-4-5"
    description: "Model for the Anthropic path, for chat and triage. Raise to claude-sonnet-5 if the radar misses things worth knowing."
  BASETEN_API_KEY:
    name: BASETEN_API_KEY
    datatype: string
    secret: true
    optional: true
    description: "Set this to switch the whole agent to Baseten. Baseten wins when both keys are set."
  BASETEN_BASE_URL:
    name: BASETEN_BASE_URL
    datatype: string
    optional: true
    default: "https://inference.baseten.co/v1"
    description: "Baseten inference base URL. Change it for a dedicated deployment."
  BASETEN_MODEL:
    name: BASETEN_MODEL
    datatype: string
    optional: true
    display-as: select
    # Snapshot, and it will go stale — an earlier copy of this list had five
    # retired entries, each a dead option a deployer could pick. Verify before
    # editing: curl $BASETEN_BASE_URL/models -H "Authorization: Bearer $BASETEN_API_KEY"
    options:
      - zai-org/GLM-5.3
      - zai-org/GLM-5.3-Flash
      - zai-org/GLM-5.2
      - deepseek-ai/DeepSeek-V4-Pro
      - deepseek-ai/DeepSeek-V4-Flash-0731
      - moonshotai/Kimi-K3
      - nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B
      - openai/gpt-oss-120b
    default: "zai-org/GLM-4.7"
    description: "Model for the Baseten path. Every option supports tool calling, which this agent requires. Flash/Fast tiers are cheaper."
  SLACK_WORKSPACE_DOMAIN:
    name: SLACK_WORKSPACE_DOMAIN
    datatype: string
    description: "The 'acme' in acme.slack.com. Without it, thread links degrade to a slack:// URI."
  # Field reference and a worked example: README.md, teams.example.yml.
  # Unknown fields are ignored silently, which is the usual reason a
  # hand-written registry does nothing.
  TEAMS_CONFIG:
    name: TEAMS_CONFIG
    datatype: string
    optional: true
    display-as: long-text
    description: >-
      Optional. Your teams, and who to notify about what. Leave blank to set it
      up by DMing the agent instead. JSON or YAML — prefer JSON, which survives
      being flattened to one line. Only `key` is required; unknown fields are
      ignored. Applied only when the registry is empty; after that, edit teams
      in Slack. Use real Slack IDs, placeholders are rejected. Example:
      {"teams":[{"key":"platform","name":"Platform","description":"Owns the API gateway, auth/SSO and rate limiting.","leads":["U01ABCDEFGH"],"keywords":["gateway","envoy","rate limit","sso","429"],"topics":["API gateway routing and rate limits"],"home_channels":["C01ABCDEFGH"]}]}
  RADAR_TIMEZONE:
    name: RADAR_TIMEZONE
    datatype: string
    default: "America/New_York"
    description: "Timezone for the instant-DM window (weekdays 09:00-18:00 local). Anything outside it waits for the next digest."

# Scheduled jobs do not inherit the agent's Slack token, so it is repeated per
# job. Postgres credentials do reach them, by secretKeyRef from the knowledge
# store. On a platform older than astropods/astro#2902 that is true of the cron
# path only, and a job started by `ast agent trigger` dies with 28000.
ingestion:
  # Score ripe discussions and DM anything urgent.
  discussion-sweep:
    container:
      build:
        context: .
        dockerfile: scheduler/Dockerfile
    trigger:
      type: schedule
    inputs:
      - name: RADAR-SLACK-BOT-TOKEN
        datatype: string
        secret: true
        description: "Slack bot token (xoxb-...), so this job can DM leads and read their reactions. Same value as the agent's."
      # Everything else is hardcoded in scheduler/src/config.ts, with the table
      # in README.md. Each constant still reads its env var first, so
      # re-exposing one is uncommenting a stub here — no code deploy.
      #
      # - name: JUDGE_MODEL          # run a different model for the judge than for chat
      #   datatype: string
      #   optional: true
      #   description: "Overrides the judge's model on whichever backend is active. Inherits ANTHROPIC_MODEL / BASETEN_MODEL when blank."
      # - name: SWEEP_QUIET_MINUTES  # default 10 — how long a thread must be silent before it is judged
      # - name: SWEEP_BURST_MESSAGES # default 8  — ...or this many messages while still live
      # - name: SWEEP_MAX_DISCUSSIONS# default 60 — hard cap on judge calls per run
      # - name: PREFILTER_MIN_SCORE  # default 1  — raise to cut model spend, at the cost of recall
      # - name: JEV_IMPACT_FLOOR     # default 0.15 — raise to drop more before the judge
      # - name: NOISE_PENALTY        # default 0.3 — how hard thumbs-down raises the bar; 0 disables the feedback loop
      # - name: MESSAGE_RETENTION_DAYS # default 30 — re-expose this one FIRST if a privacy review needs it changeable

  # Batched delivery for everything not urgent enough to interrupt for.
  lead-digest:
    container:
      build:
        context: .
        dockerfile: scheduler/Dockerfile.digest
    trigger:
      type: schedule
    inputs:
      - name: RADAR-SLACK-BOT-TOKEN
        datatype: string
        secret: true
        description: "Slack bot token (xoxb-...), so this job can send digest DMs. Same value as the sweep's."
      # This job has no working-hours gate — the cron IS the schedule. Keep it
      # inside working hours; DIGEST_MAX_ITEMS lives in config.ts.
